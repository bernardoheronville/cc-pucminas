name: diario_de_habitos
description: Um aplicativo de controle de hábitos criado com Flutter e SQLite.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  # Banco de dados local (SQLite)
  sqflite: ^2.3.3
  # SQLite no Windows/Linux
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  # Injeção de dependência para partilhar a Store
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true